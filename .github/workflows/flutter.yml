name: ClipIA Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform
        run: flutter create . --platforms=android
      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" || true
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          app = Path("android/app/build.gradle.kts")
          if not app.exists(): app = Path("android/app/build.gradle")
          if not app.exists(): raise SystemExit("App Gradle file missing")
          text = app.read_text()
          text, n = re.subn(r'(?m)^(\s*)compileSdk(?:Version)?\s*(?:=\s*)?\d+', lambda m: m.group(1) + ('compileSdk = 36' if app.suffix == '.kts' else 'compileSdkVersion 36'), text, count=1)
          if not n: raise SystemExit("compileSdk declaration missing in app")
          app.write_text(text)
          cache = Path(os.environ.get("PUB_CACHE", Path.home()/".pub-cache")) / "hosted"
          seen = set()
          for gradle in cache.glob("*/*/android/build.gradle*"):
              if gradle.suffix not in (".gradle", ".kts"): continue
              original = gradle.read_text()
              replacement = "compileSdk = 36" if gradle.suffix == ".kts" else "compileSdkVersion 36"
              updated, count = re.subn(r'(?m)^(\s*)compileSdk(?:Version)?\s*(?:=\s*)?\d+', lambda m: m.group(1)+replacement, original)
              if count:
                  gradle.write_text(updated)
                  seen.add(gradle.parent.parent.name)
          for required in ("file_picker", "flutter_plugin_android_lifecycle"):
              if not any(name == required or name.startswith(required + "-") for name in seen): raise SystemExit(f"SDK 36 patch missing for {required}; patched: {sorted(seen)}")
          print("Android app and plugins configured for SDK 36")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipia-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
