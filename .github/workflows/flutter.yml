name: ClipIA Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform
        run: flutter create . --platforms=android
      - name: Configure Android SDK 36 for app and plugins
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" || true
          python3 - <<'PY'
          from pathlib import Path

          app_gradle = Path("android/app/build.gradle.kts")
          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle")
          if not app_gradle.exists():
              raise SystemExit("Generated app Gradle file was not found")

          lines = app_gradle.read_text().splitlines()
          changed = False
          for index, line in enumerate(lines):
              stripped = line.lstrip()
              if stripped.startswith("compileSdk") and "=" in stripped:
                  indent = line[:len(line) - len(stripped)]
                  lines[index] = indent + "compileSdk = 36"
                  changed = True
                  break
              if stripped.startswith("compileSdkVersion "):
                  indent = line[:len(line) - len(stripped)]
                  lines[index] = indent + "compileSdkVersion 36"
                  changed = True
                  break
          if not changed:
              raise SystemExit("Could not find compileSdk declaration in app Gradle file")
          app_gradle.write_text("\n".join(lines) + "\n")
          print(f"Configured app compileSdk 36 in {app_gradle}")

          root_gradle = Path("android/build.gradle.kts")
          if not root_gradle.exists():
              raise SystemExit("Generated root build.gradle.kts was not found")
          root_content = root_gradle.read_text()
          root_content += """

          // Set compile SDK 36 on Android plugin modules as well.
          subprojects {
              afterEvaluate {
                  val androidExtension = extensions.findByName("android")
                  if (androidExtension != null) {
                      val setter = androidExtension.javaClass.methods.firstOrNull {
                          it.name == "compileSdkVersion" &&
                              it.parameterTypes.size == 1 &&
                              it.parameterTypes[0] == Int::class.javaPrimitiveType
                      }
                      setter?.invoke(androidExtension, 36)
                  }
              }
          }
          """
          root_gradle.write_text(root_content)
          print("Configured compileSdk 36 for Android subprojects")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipia-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
