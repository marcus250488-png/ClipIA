name: ClipIA Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform
        run: flutter create . --platforms=android
      - name: Configure Android SDK 36 for app
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" || true
          python3 - <<'PY'
          from pathlib import Path

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          app_gradle = next((p for p in candidates if p.exists()), None)
          if app_gradle is None:
              raise SystemExit("Generated app Gradle file was not found")
          lines = app_gradle.read_text().splitlines()
          for i, line in enumerate(lines):
              stripped = line.lstrip()
              if stripped.startswith("compileSdk") and ("=" in stripped or "compileSdkVersion " in stripped):
                  indent = line[:len(line) - len(stripped)]
                  key = "compileSdk" if "=" in stripped else "compileSdkVersion"
                  lines[i] = f"{indent}{key} = 36" if key == "compileSdk" else f"{indent}{key} 36"
                  break
          else:
              raise SystemExit("Could not find compileSdk declaration in app Gradle file")
          app_gradle.write_text("\\n".join(lines) + "\\n")
          print(f"Configured app compileSdk 36 in {app_gradle}")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Android plugin compile SDK 36
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          roots = [cache / "hosted" / "pub.dev"]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for gradle in list(root.glob("*/android/build.gradle")) + list(root.glob("*/android/build.gradle.kts")):
                  original = gradle.read_text()
                  updated = re.sub(r"(?m)^(\\s*compileSdk\\s*=\\s*)\\d+", r"\\g<1>36", original)
                  updated = re.sub(r"(?m)^(\\s*compileSdkVersion\\s+)\\d+", r"\\g<1>36", updated)
                  if updated != original:
                      gradle.write_text(updated)
                      changed.append(str(gradle))
          print(f"Updated compileSdk in {len(changed)} plugin Gradle files")
          for path in changed:
              print(path)
          PY
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipia-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
