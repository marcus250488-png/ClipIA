name: ClipIA Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform
        run: flutter create . --platforms=android
      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" || true
          python3 - <<'PY'
          from pathlib import Path
          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]
          configured = False
          for path in candidates:
              if path.exists():
                  content = path.read_text()
                  content = content.replace("flutter.compileSdkVersion", "36")
                  content = content.replace("compileSdkVersion 34", "compileSdkVersion 36")
                  content = content.replace("compileSdk = 34", "compileSdk = 36")
                  path.write_text(content)
                  if "compileSdk" in content:
                      configured = True
                      print(f"Configured compile SDK 36 in {path}")
          if not configured:
              raise SystemExit("Could not configure compileSdk 36 in generated Android app")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipia-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
