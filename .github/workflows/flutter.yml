name: ClipIA Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform
        run: flutter create . --platforms=android
      - name: Configure Android SDK 36
        run: |
          yes | sdkmanager "platforms;android-36"
          python3 - <<'PY'
          from pathlib import Path
          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]
          for path in candidates:
              if path.exists():
                  content = path.read_text()
                  content = content.replace("flutter.compileSdkVersion", "36")
                  content = content.replace("compileSdkVersion 34", "compileSdkVersion 36")
                  content = content.replace("compileSdk = 34", "compileSdk = 36")
                  path.write_text(content)
                  print(f"Configured compile SDK 36 in {path}")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipia-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
